<!--
  オリカジェネレーター ／ オリカバトラー
  ・v4/v5のJSON構造を正本として踏襲。効果処理はエンジニア側が実装するので、ここは「サンプルJSONを出す器」。
  ・今日の確定を反映: シールド廃止→ライフ制(actionのtarget=Player/SelfPlayer)／モンスターHP累積／
    文明で作れる効果を縛らない(COLOR_PIE廃止＝全動詞・全KWが常に選べる。文明はフレーバー＋将来のステージ用)。
  ・スコープはtrigger名に畳む(OnSummon / OnAllySummon / OnEnemySummon …)。
  JSON出力スキーマ:
  { cardId, name, civilizations:[], type, cost:{type:"EN",value}, tags:[],
    stats:{attack,defense}, effectDescription,
    effects:[ {trigger, conditions:{}, actions:[{type,target,selection,count,value}]} ],
    continuousEffects:[ {conditions:{}, modifiers:[{type,value}]} ],
    conditions:[] }
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オリカジェネレーター — オリカバトラー</title>
<style>
  :root{
    --bg:#0d0b12; --s1:#16131f; --s2:#1e1a2b; --s3:#272234;
    --line:#352e47; --line2:#473d5e;
    --ink:#ece6f2; --ink2:#a99fbd; --ink3:#766c8a;
    --ember:#f0531c; --ember2:#ff8a4a; --gold:#e8b04b;
    --fire:#e0533d; --water:#4a90d9; --wood:#6fa84b; --light:#e8c860; --dark:#9b6dc4;
    --bad:#e0574f; --ok:#6fb35a; --warn:#e0b24a;
    --mono:ui-monospace,Menlo,Consolas,monospace;
    --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(80% 50% at 50% -8%, #f0531c14 0%, #0d0b1200 55%),
      radial-gradient(60% 40% at 90% 110%, #8b6cef10 0%, #0d0b1200 60%), var(--bg);
    color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:20px 16px 90px}
  header{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-family:var(--mincho);font-size:26px;font-weight:700;letter-spacing:.1em;
    background:linear-gradient(100deg,var(--gold),var(--ember2),var(--ember));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  header .sub{font-size:11px;letter-spacing:.34em;color:var(--ink3);font-family:var(--mono)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .chip{font-size:11px;color:var(--ink2);background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .cols{display:grid;grid-template-columns:1fr 348px;gap:18px;align-items:start}
  @media(max-width:860px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px}
  .panel+.panel{margin-top:14px}
  .panel h2{margin:0 0 12px;font-size:11px;letter-spacing:.2em;color:var(--ink3);font-weight:700;text-transform:uppercase}
  .panel h2 .hint{float:right;font-size:10px;letter-spacing:.02em;color:var(--ink3);text-transform:none;font-weight:400}
  label.fld{display:block;font-size:11px;color:var(--ink2);margin-bottom:4px;letter-spacing:.03em}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:88px}
  input[type=text],input[type=number],select,textarea{width:100%;background:var(--s2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-family:var(--sans);font-size:14px;outline:none}
  input:focus,select:focus{border-color:var(--ember)}
  input[type=number]{font-variant-numeric:tabular-nums}
  input:disabled{opacity:.35}
  select{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 15px) 17px,calc(100% - 10px) 17px;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;min-width:50px;background:var(--s2);border:1px solid var(--line);color:var(--ink2);border-radius:8px;padding:7px 4px;font-size:12.5px;cursor:pointer;font-family:var(--sans)}
  .seg button.on{color:#160f0a;font-weight:700;border-color:transparent;background:var(--gold)}
  .civ button[data-c=Fire].on{background:var(--fire);color:#fff}.civ button[data-c=Water].on{background:var(--water);color:#fff}
  .civ button[data-c=Wood].on{background:var(--wood);color:#fff}.civ button[data-c=Light].on{background:var(--light);color:#160f0a}
  .civ button[data-c=Dark].on{background:var(--dark);color:#fff}
  .kwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:7px}
  .kw{display:flex;flex-direction:column;align-items:stretch;gap:5px;background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;user-select:none;font-size:12.5px}
  .kw.on{border-color:var(--ember);background:#2a1a16}
  .kw .kwtop{display:flex;align-items:center;gap:7px}
  .kw input[type=checkbox]{accent-color:var(--ember);margin:0;flex:none}
  .kw .nm{font-weight:700}
  .kw .kwdesc{font-size:11px;color:var(--ink3);line-height:1.45}
  .kw.on .kwdesc{color:var(--ember2)}
  .kw .kx{width:48px;padding:2px;font-size:12px;text-align:center;margin-left:auto}
  .kw .kx[hidden]{display:none}
  .eff{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px}
  .eff .eh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .eff .eh b{font-size:11px;color:var(--ink3);letter-spacing:.1em;font-weight:700}
  .eff .del{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:17px;line-height:1;padding:0 3px}.eff .del:hover{color:var(--bad)}
  .eg{display:grid;gap:8px;margin-bottom:8px}.eg.c2{grid-template-columns:1fr 1fr}
  .act{background:var(--s3);border:1px solid var(--line);border-radius:8px;padding:9px;margin-top:7px}
  .act .ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .act .ah span{font-size:10.5px;color:var(--ink3);letter-spacing:.08em}
  .act .ax{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:14px}.act .ax:hover{color:var(--bad)}
  .addbtn{width:100%;background:none;border:1px dashed var(--line2);color:var(--ink2);border-radius:8px;padding:8px;cursor:pointer;font-family:var(--sans);font-size:12.5px;margin-top:6px}
  .addbtn:hover{border-color:var(--ember);color:var(--ember2)}
  .addbtn.sm{padding:6px;font-size:12px}
  .prev-line{font-size:12px;color:var(--gold);font-family:var(--mono);line-height:1.5;margin-top:4px}
  .note{font-size:11px;color:var(--ink3);margin:0 0 8px}
  /* preview card */
  .stickside{position:sticky;top:16px}
  .card{position:relative;border-radius:16px;padding:3px;background:linear-gradient(155deg,var(--cv,#666),#15101c 72%);box-shadow:0 14px 36px #0009}
  .card .in{background:linear-gradient(180deg,#1c1726,#141019);border-radius:13px;padding:13px;min-height:340px;display:flex;flex-direction:column}
  .card .ct{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .card .nm{font-family:var(--mincho);font-size:17px;font-weight:700;line-height:1.25}
  .card .cost{flex:none;width:36px;height:36px;border-radius:50%;background:var(--cv,#666);color:#160f0a;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .card .meta{font-size:11px;color:var(--ink3);letter-spacing:.1em;margin-top:6px}
  .card .art{flex:1;margin:10px 0;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:11px;letter-spacing:.2em;min-height:64px;background:#0004}
  .card .kws{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px}
  .card .kws span{font-size:11px;background:var(--cv,#666);color:#160f0a;font-weight:700;border-radius:4px;padding:1px 7px}
  .card .txt{font-size:11.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:7px;min-height:30px;white-space:pre-wrap}
  .card .st{display:flex;justify-content:flex-end;gap:5px;margin-top:8px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
  .card .atk{color:var(--ember2)}.card .hp{color:var(--water)}
  .est{margin-top:12px;font-size:12.5px}.est .l{display:flex;justify-content:space-between;padding:3px 0;color:var(--ink2)}.est .l b{color:var(--ink)}
  .flags{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .flag{font-size:11.5px;border-radius:7px;padding:7px 9px;line-height:1.45}
  .flag.warn{background:#2a2410;border:1px solid #564a1c;color:var(--warn)}
  .flag.bad{background:#2a1413;border:1px solid #552220;color:#e9938d}
  .flag.info{background:#141f24;border:1px solid #284450;color:#7fc1d4}
  .flag.ok{background:#15240f;border:1px solid #2c4a1f;color:#9cc77c}
  .btns{display:flex;gap:10px;margin-top:14px}
  .btn{flex:1;border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans);border:1px solid var(--line2);background:var(--s2);color:var(--ink)}
  .btn.primary{background:linear-gradient(100deg,var(--ember),var(--ember2));color:#1a0f08;border-color:transparent}
  .btn:hover{filter:brightness(1.08)}
  .jsonwrap{margin-top:14px}
  .jsonwrap .jh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .jsonwrap .jh span{font-size:11px;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase;font-weight:700}
  .jsonwrap .jb{display:flex;gap:6px}
  .ghost{background:var(--s2);border:1px solid var(--line2);color:var(--ink);border-radius:7px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:var(--sans)}.ghost:hover{border-color:var(--ember);color:var(--ember2)}
  pre.json{background:#0a0810;border:1px solid var(--line);border-radius:9px;padding:12px;font-family:var(--mono);font-size:11px;color:var(--ink2);max-height:300px;overflow:auto;white-space:pre;margin:0}
</style>

<div class="wrap">
  <header>
    <div><h1>オリカジェネレーター</h1><div class="sub">ORICA BATTLER ／ CARD FORGE</div></div>
    <div class="chips">
      <span class="chip">ライフ制 / HP累積</span>
      <span class="chip">タップ無し・受け身</span>
      <span class="chip">各効果ターン1</span>
      <span class="chip">文明＝フレーバー</span>
    </div>
  </header>

  <div class="cols">
    <div>
      <!-- 基本 -->
      <div class="panel">
        <h2>基本</h2>
        <div class="row">
          <div style="flex:2"><label class="fld">カード名</label><input id="f-name" type="text" placeholder="例: 煉獄の番竜"></div>
          <div><label class="fld">種類</label>
            <div class="seg" id="seg-type"><button data-t="Monster" class="on">モンスター</button><button data-t="Spell">スペル</button><button data-t="Object">オブジェクト</button></div>
          </div>
        </div>
        <div class="row" style="margin-top:10px">
          <div class="mon" id="atk-wrap"><label class="fld">ATK</label><input id="f-atk" type="number" min="0" value="3"></div>
          <div class="mon"><label class="fld">HP</label><input id="f-hp" type="number" min="1" value="5"></div>
          <div><label class="fld">タグ／種族（カンマ区切り）</label><input id="f-tags" type="text" placeholder="例: 竜, 煉獄"></div>
        </div>
        <div style="margin-top:10px"><label class="fld">文明（複数可・フレーバー）</label>
          <div class="seg civ" id="seg-civ">
            <button data-c="Fire">火</button><button data-c="Water">水</button><button data-c="Wood">自然</button><button data-c="Light">光</button><button data-c="Dark">闇</button>
          </div>
        </div>
      </div>

      <!-- キーワード -->
      <div class="panel mon">
        <h2>キーワード能力（常在）<span class="hint">カタカナ＋説明つき</span></h2>
        <div class="kwgrid" id="kwgrid"></div>
      </div>

      <!-- 効果 -->
      <div class="panel">
        <h2>効果（トリガー × アクション）<span class="hint">対象はアクションで自動的に絞られる</span></h2>
        <p class="note">同じトリガーにアクションを複数並べると上から順に解決（1個目にコスト、2個目に本体、が書ける）</p>
        <div id="efflist"></div>
        <button class="addbtn" id="add-eff">＋ 効果（トリガー）を追加</button>
      </div>

      <!-- カード条件 -->
      <div class="panel">
        <h2>発動条件（カード全体）<span class="hint">割引対象。相手依存ほど割引大</span></h2>
        <div id="condlist"></div>
        <button class="addbtn sm" id="add-cond">＋ 条件を追加</button>
      </div>

      <div class="btns"><button class="btn" id="btn-reset">クリア</button><button class="btn primary" id="btn-dl">JSONをダウンロード</button></div>
    </div>

    <!-- プレビュー -->
    <div class="stickside">
      <div class="panel">
        <h2>プレビュー</h2>
        <div class="card" id="card"><div class="in">
          <div class="ct"><div class="nm" id="c-nm">無名のオリカ</div><div class="cost" id="c-cost">3</div></div>
          <div class="meta" id="c-meta">火 / モンスター</div>
          <div class="art">ILLUSTRATION</div>
          <div class="kws" id="c-kws"></div>
          <div class="txt" id="c-txt"></div>
          <div class="st" id="c-st"><span class="atk" id="c-atk">3</span><span style="color:var(--ink3)">/</span><span class="hp" id="c-hp">5</span></div>
        </div></div>
        <div class="est">
          <div class="l"><span>推定コスト（EN）</span><b id="e-cost">—</b></div>
          <div class="l"><span>査定スコア（CP）</span><b id="e-cp">—</b></div>
          <div class="flags" id="flags"></div>
        </div>
        <div class="jsonwrap">
          <div class="jh"><span>JSON</span><div class="jb"><button class="ghost" id="j-copy">コピー</button></div></div>
          <pre class="json" id="jsonout">{}</pre>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== マスターデータ（v5構造＋今日の台帳。文明ロックなし＝全部使える） ===== */
const CIVJP={Fire:'火',Water:'水',Wood:'自然',Light:'光',Dark:'闇'};

// トリガー（スコープはtrigger名に畳む）。types: which card types can use it
const TRIGGERS=[
  {v:'OnSummon',         jp:'このカードが場に出た時',           types:['Monster','Object']},
  {v:'OnAllySummon',     jp:'自分の他のモンスターが場に出た時', types:['Monster','Object']},
  {v:'OnEnemySummon',    jp:'相手モンスターが場に出た時',       types:['Monster','Object']},
  {v:'OnDeath',          jp:'このカードが破壊された時',         types:['Monster','Object']},
  {v:'OnAllyDeath',      jp:'自分の他のモンスターが破壊された時',types:['Monster','Object']},
  {v:'OnEnemyDeath',     jp:'相手モンスターが破壊された時',     types:['Monster','Object']},
  {v:'OnAttackDeclare',  jp:'このカードが攻撃する時',           types:['Monster']},
  {v:'OnDamaged',        jp:'このカードがダメージを受けた時',   types:['Monster','Object']},
  {v:'OnSelfPlayerDamaged',jp:'自分がダメージを受けた時',       types:['Monster','Object']},
  {v:'OnDraw',           jp:'自分がドローした時',               types:['Monster','Object']},
  {v:'OnEnemyDraw',      jp:'相手がドローした時',               types:['Monster','Object']},
  {v:'OnCast',           jp:'自分がスペルを使った時',           types:['Monster','Object']},
  {v:'OnEnemyCast',      jp:'相手がスペルを使った時',           types:['Monster','Object']},
  {v:'OnTurnStart',      jp:'自分のターン開始時',               types:['Monster','Object']},
  {v:'OnTurnEnd',        jp:'自分のターン終了時',               types:['Monster','Object']},
  {v:'OnEnemyTurnEnd',   jp:'相手のターン終了時',               types:['Monster','Object']},
  {v:'OnCastThis',       jp:'このスペルを使った時',             types:['Spell']},
];
// トリガー係数（確実性。出た=確実→重い、相手依存=軽い、毎ターン=放置で雪だるま）
const TRIG_MULT={OnSummon:1.1,OnCastThis:1.1,OnAllySummon:1,OnEnemySummon:.8,OnDeath:.9,OnAllyDeath:.85,OnEnemyDeath:.8,
  OnAttackDeclare:.85,OnDamaged:.85,OnSelfPlayerDamaged:.9,OnDraw:.9,OnEnemyDraw:.7,OnCast:.85,OnEnemyCast:.75,
  OnTurnStart:1.5,OnTurnEnd:1.4,OnEnemyTurnEnd:1.2};

// アクション（動詞）。type=エンジン名 / needs / 対象候補 / score(v,c)
const ACTIONS=[
  {v:'Draw',         jp:'ドローする',                    val:1,cnt:0,tgts:[],            sc:(x)=>1.2*x},
  {v:'Damage',       jp:'ダメージを与える',              val:1,cnt:0,tgts:['Enemy','EnemyAll','EnemyRandom','Context','Player'], sc:(x)=>.6*x},
  {v:'Destroy',      jp:'破壊する',                      val:0,cnt:1,tgts:['Enemy','Context'], sc:(x,c)=>3*c},
  {v:'BuffAtk',      jp:'ATKをバフする',                 val:1,cnt:0,tgts:['Self','Ally','AllyAll'], sc:(x)=>.4*x},
  {v:'BuffHp',       jp:'HPを回復・強化する',            val:1,cnt:0,tgts:['Self','Ally','AllyAll'], sc:(x)=>.3*x},
  {v:'DebuffAtk',    jp:'ATKをデバフする',               val:1,cnt:0,tgts:['Enemy','EnemyAll'], sc:(x)=>.5*x},
  {v:'DebuffHp',     jp:'HPをデバフする',                val:1,cnt:0,tgts:['Enemy','EnemyAll'], sc:(x)=>.6*x},
  {v:'Bounce',       jp:'バウンスする（手札に戻す）',    val:0,cnt:1,tgts:['Enemy','Context'], sc:(x,c)=>2*c},
  {v:'TakeControl',  jp:'コントロールを奪う',            val:0,cnt:1,tgts:['Enemy'], sc:(x,c)=>4*c},
  {v:'Heal',         jp:'ライフを回復する',              val:1,cnt:0,tgts:['SelfPlayer'], sc:(x)=>.4*x},
  {v:'LifeDamage',   jp:'ライフにダメージ（相手本体）',  val:1,cnt:0,tgts:['Player'], sc:(x)=>.8*x},
  {v:'Revive',       jp:'蘇生する（コストxまで）',       val:1,cnt:0,tgts:['Grave'], sc:(x)=>2.5},
  {v:'AddToHand',    jp:'墓地から手札に加える',          val:0,cnt:1,tgts:['Grave'], sc:(x,c)=>1.2*c},
  {v:'MillToDeck',   jp:'墓地をデッキに戻す',            val:1,cnt:0,tgts:['GraveBoth'], sc:(x)=>.5*x},
  {v:'Token',        jp:'トークンを生み出す',            val:1,cnt:1,tgts:['SelfField'], sc:(x,c)=>.8*x*c},
  {v:'DiscardHand',  jp:'手札を破壊する（ランダム）',    val:1,cnt:0,tgts:['EnemyHand'], sc:(x)=>1*x},
  {v:'RaiseCostMon', jp:'相手クリーチャーのコストを重く',val:1,cnt:0,tgts:['EnemyMeta'], sc:(x)=>.9*x},
  {v:'RaiseCostSpell',jp:'相手スペルのコストを重く',     val:1,cnt:0,tgts:['EnemyMeta'], sc:(x)=>.9*x},
  {v:'Poison',       jp:'毒にする',                      val:1,cnt:0,tgts:['Enemy'], sc:(x)=>.7*x},
  {v:'Paralyze',     jp:'マヒにする',                    val:0,cnt:1,tgts:['Enemy'], sc:(x,c)=>1.2*c},
  {v:'Freeze',       jp:'凍結にする',                    val:0,cnt:1,tgts:['Enemy'], sc:(x,c)=>1*c},
  {v:'Burn',         jp:'やけどにする',                  val:0,cnt:1,tgts:['Enemy'], sc:(x,c)=>1*c},
  {v:'Silence',      jp:'サイレンス（効果・KW無効）',    val:0,cnt:1,tgts:['Enemy'], sc:(x,c)=>1.5*c},
  {v:'GainEN',       jp:'このターンのENを増やす',        val:1,cnt:0,tgts:[],        sc:(x)=>.7*x},
  // コスト系（割引＝マイナススコア）。効果の先頭に置く想定
  {v:'PayLife',      jp:'コスト:自分のライフを払う',     val:1,cnt:0,tgts:[],        sc:(x)=>-.5*x,cost:true},
  {v:'SelfDestroy',  jp:'コスト:このカードを破壊',       val:0,cnt:0,tgts:[],        sc:()=>-1.5,cost:true},
  {v:'DiscardOwn',   jp:'コスト:自分の手札を捨てる',     val:1,cnt:0,tgts:[],        sc:(x)=>-.6*x,cost:true},
  {v:'Sacrifice',    jp:'コスト:自分の他モンスターを生け贄',val:0,cnt:1,tgts:[],     sc:(x,c)=>-1.2*c,cost:true},
];
const TGT_JP={Enemy:'相手モンスター1体',EnemyAll:'相手モンスター全体',EnemyRandom:'相手モンスターランダム1体',
  Self:'このモンスター自身',Ally:'自分の他のモンスター1体',AllyAll:'自分のモンスター全体',
  Context:'誘発元',Player:'相手プレイヤー',SelfPlayer:'自分プレイヤー',Grave:'自分の墓地',GraveBoth:'双方の墓地',
  SelfField:'自分の場',EnemyHand:'相手の手札',EnemyMeta:'相手'};
// 体数を取る動詞用の「プール名（数を含まない）」ラベル
const OWNER_JP={Enemy:'相手モンスター',EnemyRandom:'相手モンスター（ランダム）',Ally:'自分の他のモンスター',
  Context:'誘発元',Grave:'自分の墓地',GraveBoth:'双方の墓地',SelfField:'自分の場',EnemyHand:'相手の手札'};
// 表示用ラベル：体数動詞ならプール名、それ以外は通常ラベル
function targetDisp(av,t){ if(!t) return ''; return (A(av).cnt && OWNER_JP[t]) ? OWNER_JP[t] : TGT_JP[t]; }
const TGT_MULT={EnemyAll:1.8,AllyAll:1.7,EnemyRandom:.8,Context:.85};

// キーワード（カタカナ＋説明）
// atk:true = 攻撃に関わる＝攻撃を持たないオブジェクトには付かない
const KEYWORDS=[
  {v:'SpeedAttacker',jp:'スピードアタッカー',desc:'場に出たターンに攻撃できる',x:false,sc:2,  atk:true},
  {v:'Blocker',      jp:'ブロッカー',        desc:'相手は優先してこのモンスターを攻撃しなければならない',x:false,sc:1.5,atk:true},
  {v:'Stealth',      jp:'ステルス',          desc:'相手のブロッカーを無視してプレイヤーを攻撃できる',x:false,sc:1.5,atk:true},
  {v:'Untouchable',  jp:'アンタッチャブル',  desc:'このモンスターは攻撃の対象にならない',x:false,sc:3,  atk:true},
  {v:'SpellGuard',   jp:'スペルガード',      desc:'このカードはスペルの効果を受けない',x:false,sc:2},
  {v:'Barrier',      jp:'バリア',            desc:'最初の1回のダメージを無効にする',x:false,sc:2.5},
  {v:'Break',        jp:'ブレイク',          desc:'相手モンスターのHPを超えた分、貫通してプレイヤーにダメージ',x:false,sc:3,atk:true},
  {v:'Deadly',       jp:'デッドリー',        desc:'ダメージを与えた相手モンスターを破壊する',x:false,sc:3,atk:true},
  {v:'Regen',        jp:'リジェネ',          desc:'自分のターン開始時、このカードのHPをx回復する',x:true,sc:.8},
  {v:'Aura',         jp:'オーラ',            desc:'場にいる限り、自分のモンスター全体のATKをx上げる',x:true,sc:1.2},
];

// 発動条件（割引）。kind: enemy(踏めない=割引大) / hold(維持型=割引中) / inst(瞬間=割引小)
const CONDS=[
  {v:'SelfHpBelow',     jp:'自分のライフがx以下',          kind:'inst', x:true, disc:.6},
  {v:'HoldHand',        jp:'手札がx枚以下を保つ',          kind:'hold', x:true, disc:1.0},
  {v:'HoldFieldFew',    jp:'自分の場がx体以下',            kind:'hold', x:true, disc:.8},
  {v:'DeckBelow',       jp:'デッキがx枚以下',              kind:'hold', x:true, disc:1.2},
  {v:'PartnerOnField',  jp:'自分のパートナーが場にいる',   kind:'hold', x:false,disc:1.4},
  {v:'GraveAbove',      jp:'自分の墓地がx枚以上',          kind:'hold', x:true, disc:.8},
  {v:'TurnAfter',       jp:'ターンx目以降',                kind:'hold', x:true, disc:.9},
  {v:'ThisHpFull',      jp:'このカードのHPが満タン',       kind:'inst', x:false,disc:.4},
  {v:'EnemyFieldAbove', jp:'相手の場がx体以上',            kind:'enemy',x:true, disc:1.4},
  {v:'EnemyCivAbove',   jp:'相手の場にx属性がx体以上',     kind:'enemy',x:true, disc:1.3},
  {v:'EnemyPartner',    jp:'相手のパートナーが場にいる',   kind:'enemy',x:false,disc:1.5},
  {v:'EnemyGraveAbove', jp:'相手の墓地がx枚以上',          kind:'enemy',x:true, disc:1.2},
  {v:'EnemyHpAbove',    jp:'相手のライフが自分より多い',   kind:'enemy',x:false,disc:1.3},
];

/* ===== 状態 ===== */
const A=v=>ACTIONS.find(a=>a.v===v), T=v=>TRIGGERS.find(t=>t.v===v), K=v=>KEYWORDS.find(k=>k.v===v), C=v=>CONDS.find(c=>c.v===v);
function uuid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16)});}
let card={id:uuid(),name:'',type:'Monster',atk:3,hp:5,civs:[],tags:[],keywords:[],effects:[],conditions:[]};
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);

/* ===== キーワードUI ===== */
function kwDescText(k,val){ return k.x ? k.desc.replace('x', val||2) : k.desc; }
function buildKw(){
  const g=$('#kwgrid');g.innerHTML='';
  KEYWORDS.filter(k=>card.type!=='Object'||!k.atk).forEach(k=>{
    const has=card.keywords.find(x=>x.v===k.v);
    const val=(has&&has.value)||2;
    const el=document.createElement('label');el.className='kw'+(has?' on':'');el.dataset.v=k.v;
    el.innerHTML=`<div class="kwtop"><input type="checkbox" ${has?'checked':''}><span class="nm">${k.jp}</span>`+
      (k.x?`<input class="kx" type="number" min="1" value="${val}" ${has?'':'hidden'}>`:'')+`</div>`+
      `<div class="kwdesc">${kwDescText(k,val)}</div>`;
    const cb=el.querySelector('input[type=checkbox]'),kx=el.querySelector('.kx'),dd=el.querySelector('.kwdesc');
    cb.addEventListener('change',()=>{el.classList.toggle('on',cb.checked);if(kx)kx.hidden=!cb.checked;syncKw();});
    if(kx)kx.addEventListener('input',()=>{dd.textContent=kwDescText(k,+kx.value||1);syncKw();});
    g.appendChild(el);
  });
}
function syncKw(){
  card.keywords=[];
  $$('.kw').forEach(el=>{const cb=el.querySelector('input[type=checkbox]');if(!cb.checked)return;
    const v=el.dataset.v,o={v};if(K(v).x)o.value=+el.querySelector('.kx').value||1;card.keywords.push(o);});
  render();
}

/* ===== 効果UI ===== */
function validTrigs(){return TRIGGERS.filter(t=>t.types.includes(card.type));}
function defaultTrig(){return validTrigs()[0].v;}
$('#add-eff').addEventListener('click',()=>{
  card.effects.push({trigger:defaultTrig(),actions:[blankAct(defaultTrig())]});renderEff();render();});
function blankAct(){return {v:'Damage',target:'Enemy',value:2,count:1};}
function actTargets(av,trig){
  const a=A(av);let t=[...a.tgts];
  // 誘発元は、役者を出すトリガーのみ
  const hasCtx=['OnAttackDeclare','OnDamaged','OnEnemyDeath','OnAllyDeath','OnEnemySummon','OnAllySummon'].includes(trig);
  if(!hasCtx) t=t.filter(x=>x!=='Context');
  return t;
}
function fixAct(ef,act){
  const tg=actTargets(act.v,ef.trigger);
  if(tg.length&&!tg.includes(act.target))act.target=tg[0];
  if(!tg.length)act.target=null;
}
function renderEff(){
  const box=$('#efflist');box.innerHTML='';
  card.effects.forEach((ef,i)=>{
    const trigs=validTrigs();
    const el=document.createElement('div');el.className='eff';
    el.innerHTML=`<div class="eh"><b>効果 ${i+1}</b><button class="del">×</button></div>
      <div class="eg"><div><label class="fld">トリガー（いつ）</label><select class="e-trig">
        ${trigs.map(t=>`<option value="${t.v}" ${t.v===ef.trigger?'selected':''}>${t.jp}</option>`).join('')}</select></div></div>
      <div class="acts"></div>
      <button class="addbtn sm add-act">＋ アクションを追加</button>
      <div class="prev-line"></div>`;
    el.querySelector('.del').addEventListener('click',()=>{card.effects.splice(i,1);renderEff();render();});
    el.querySelector('.e-trig').addEventListener('change',e=>{ef.trigger=e.target.value;ef.actions.forEach(a=>fixAct(ef,a));renderEff();render();});
    const ab=el.querySelector('.acts');
    ef.actions.forEach((act,j)=>ab.appendChild(actRow(ef,act,j)));
    el.querySelector('.add-act').addEventListener('click',()=>{const a=blankAct();fixAct(ef,a);ef.actions.push(a);renderEff();render();});
    el.querySelector('.prev-line').textContent=ef.actions.map(a=>actText(ef,a)).join(' → ');
    box.appendChild(el);
  });
}
function actRow(ef,act,j){
  const a=A(act.v),tg=actTargets(act.v,ef.trigger);
  const showCnt=a.cnt && act.target!=='Context';   // 誘発元は単体固定＝体数なし
  const showVal=a.val;
  const el=document.createElement('div');el.className='act';
  let numCol='';
  if(showVal&&showCnt) numCol=`<div style="display:flex;gap:6px"><div style="flex:1"><label class="fld">値</label><input class="a-val" type="number" value="${act.value??1}"></div><div style="flex:1"><label class="fld">体数</label><input class="a-cnt" type="number" min="1" value="${act.count||1}"></div></div>`;
  else if(showCnt) numCol=`<label class="fld">体数/枚数</label><input class="a-cnt" type="number" min="1" value="${act.count||1}">`;
  else if(showVal) numCol=`<label class="fld">値</label><input class="a-val" type="number" value="${act.value??1}">`;
  else numCol=`<label class="fld">—</label><input type="number" disabled value="-">`;
  el.innerHTML=`<div class="ah"><span>アクション ${j+1}</span><button class="ax">×</button></div>
    <div class="eg c2">
      <div><label class="fld">何をする</label><select class="a-v">
        ${ACTIONS.map(x=>`<option value="${x.v}" ${x.v===act.v?'selected':''}>${x.jp}</option>`).join('')}</select></div>
      <div>${numCol}</div>
    </div>
    ${tg.length?`<div class="eg"><div><label class="fld">対象</label><select class="a-tgt">
      ${tg.map(x=>`<option value="${x}" ${x===act.target?'selected':''}>${targetDisp(act.v,x)}</option>`).join('')}</select></div></div>`:''}`;
  el.querySelector('.ax').addEventListener('click',()=>{ef.actions.splice(j,1);if(!ef.actions.length)ef.actions.push(blankAct());renderEff();render();});
  el.querySelector('.a-v').addEventListener('change',e=>{act.v=e.target.value;fixAct(ef,act);renderEff();render();});
  const cv=el.querySelector('.a-val');if(cv)cv.addEventListener('input',e=>{act.value=+e.target.value||0;render();});
  const cc=el.querySelector('.a-cnt');if(cc)cc.addEventListener('input',e=>{act.count=+e.target.value||1;render();});
  const ct=el.querySelector('.a-tgt');if(ct)ct.addEventListener('change',e=>{act.target=e.target.value;renderEff();render();});
  return el;
}

/* ===== 条件UI ===== */
$('#add-cond').addEventListener('click',()=>{card.conditions.push({v:CONDS[0].v,value:3});renderCond();render();});
function renderCond(){
  const box=$('#condlist');box.innerHTML='';
  card.conditions.forEach((cd,i)=>{
    const c=C(cd.v);
    const el=document.createElement('div');el.className='act';
    el.innerHTML=`<div class="ah"><span>条件 ${i+1}（${c.kind==='enemy'?'相手依存・割引大':c.kind==='hold'?'維持型・割引中':'瞬間型・割引小'}）</span><button class="ax">×</button></div>
      <div class="eg ${c.x?'c2':''}"><div><select class="c-v">
        ${CONDS.map(x=>`<option value="${x.v}" ${x.v===cd.v?'selected':''}>${x.jp}</option>`).join('')}</select></div>
        ${c.x?`<div><input class="c-x" type="number" min="1" value="${cd.value||1}"></div>`:''}</div>`;
    el.querySelector('.ax').addEventListener('click',()=>{card.conditions.splice(i,1);renderCond();render();});
    el.querySelector('.c-v').addEventListener('change',e=>{cd.v=e.target.value;renderCond();render();});
    const cx=el.querySelector('.c-x');if(cx)cx.addEventListener('input',e=>{cd.value=+e.target.value||1;render();});
    box.appendChild(el);
  });
}

/* ===== テキスト整形 ===== */
function actText(ef,a){
  const def=A(a.v);
  const t=a.target?TGT_JP[a.target]:'';            // 通常ラベル（1体/全体つき）
  const isCtx=a.target==='Context';
  const own=a.target?(OWNER_JP[a.target]||TGT_JP[a.target]):''; // プール名（数なし）
  const x=def.val?(a.value??0):'';
  const c=def.cnt?(a.count||1):1;
  // 体数動詞の対象句：誘発元なら単体、それ以外は「プール名をc体」
  const nC=isCtx?`${own}を`:`${own}を${c}体`;
  let s;
  switch(a.v){
    case 'Draw':s=`${x}枚ドロー`;break;
    case 'Damage':s=`${t}に${x}ダメージ`;break;
    case 'Destroy':s=`${nC}破壊`;break;
    case 'BuffAtk':s=`${t}のATKを+${x}`;break;
    case 'BuffHp':s=`${t}のHPを+${x}`;break;
    case 'DebuffAtk':s=`${t}のATKを−${x}`;break;
    case 'DebuffHp':s=`${t}のHPを−${x}`;break;
    case 'Bounce':s=`${nC}手札に戻す`;break;
    case 'TakeControl':s=isCtx?`${own}のコントロールを奪う`:`${own}を${c}体奪い、自分の場に出す`;break;
    case 'Heal':s=`自分のライフを${x}回復`;break;
    case 'LifeDamage':s=`相手プレイヤーに${x}ダメージ`;break;
    case 'Revive':s=`自分の墓地からコスト${x}以下を1体蘇生`;break;
    case 'AddToHand':s=`自分の墓地から${c}枚を手札に加える`;break;
    case 'MillToDeck':s=`双方の墓地から計${x}枚をデッキに戻す`;break;
    case 'Token':s=`ATK${x}/HP${x}のトークンを${c}体生成`;break;
    case 'DiscardHand':s=`相手の手札を${x}枚ランダムに破壊`;break;
    case 'RaiseCostMon':s=`相手クリーチャーのコストを+${x}`;break;
    case 'RaiseCostSpell':s=`相手スペルのコストを+${x}`;break;
    case 'Poison':s=`${t}を毒(${x})にする`;break;
    case 'Paralyze':s=`${t}をマヒにする`;break;
    case 'Freeze':s=`${t}を凍結にする`;break;
    case 'Burn':s=`${t}をやけどにする`;break;
    case 'Silence':s=`${t}の効果とキーワードを無効にする`;break;
    case 'GainEN':s=`このターンのENを+${x}`;break;
    case 'PayLife':s=`[コスト]自分のライフを${x}払う`;break;
    case 'SelfDestroy':s=`[コスト]このカードを破壊する`;break;
    case 'DiscardOwn':s=`[コスト]自分の手札を${x}枚捨てる`;break;
    case 'Sacrifice':s=`[コスト]自分の他のモンスターを${c}体生け贄にする`;break;
    default:s=def.jp;
  }
  return s;
}
function fullText(){
  let lines=[];
  card.keywords.forEach(k=>{const d=K(k.v);lines.push(`【${d.jp}${d.x?' '+k.value:''}】${d.desc.replace('x',k.value||'')}`);});
  card.effects.forEach(ef=>{const tj=T(ef.trigger).jp;lines.push(`${tj}：`+ef.actions.map(a=>actText(ef,a)).join(' → '));});
  if(card.conditions.length)lines.push('（条件：'+card.conditions.map(cd=>{const c=C(cd.v);return c.jp.replace('x',cd.value||'');}).join(' / ')+'）');
  return lines.join('\n');
}

/* ===== 査定（カタログ式・足し算中心） =====
   EFFECT_SCALE＝効果/キーワード/条件の重みを一括で上下させる調整ノブ。
   下げるほど効果が安くなる（ステータスは据え置き）。バランス調整はここ1箇所でOK。 */
const EFFECT_SCALE=0.6;
function score(){
  let stat=0;
  if(card.type!=='Spell') stat+=(card.atk+card.hp)/4;
  if(card.type==='Object') stat+=card.hp/8; // 攻撃しない分の常在価値の下駄
  let abil=0;
  card.keywords.forEach(k=>{const d=K(k.v);abil+=d.x?d.sc*(k.value||1):d.sc;});
  card.effects.forEach(ef=>{
    const tm=TRIG_MULT[ef.trigger]||1;
    ef.actions.forEach(a=>{const def=A(a.v);let v=def.sc(def.val?a.value||0:0,def.cnt?a.count||1:1);
      v*=(TGT_MULT[a.target]||1);abil+=v*(def.cost?1:tm);});
  });
  card.conditions.forEach(cd=>{const c=C(cd.v);let d=c.disc;if(c.x)d*=Math.min(2,(cd.value||1)/3+.5);abil-=d;});
  return stat + abil*EFFECT_SCALE;
}
function finalCost(){return Math.max(1,Math.min(10,Math.round(score())));}

/* ===== 危険フラグ ===== */
function flags(){
  const f=[];
  card.effects.forEach((ef,i)=>{
    ef.actions.forEach(a=>{
      if(a.v==='PayLife'||a.v==='SelfDestroy'||a.v==='DiscardOwn'||a.v==='Sacrifice')
        f.push({t:'info',m:`効果${i+1}: コスト(${A(a.v).jp.replace('コスト:','')})を払う＝割引。シナジーの起点`});
      if((a.v==='Destroy'||a.v==='Damage')&&a.target==='EnemyAll')
        f.push({t:'bad',m:`効果${i+1}: 全体${a.v==='Destroy'?'破壊':'ダメージ'}。横展開メタの要だが単発で盤面消滅、ENとトリガーを絞る`});
      if(a.v==='TakeControl')f.push({t:'warn',m:`効果${i+1}: コントロール奪取は実質2枚分。査定激重・タイミング厳しく`});
      if((ef.trigger==='OnTurnStart'||ef.trigger==='OnTurnEnd')&&(a.v==='Draw'||a.v==='GainEN'))
        f.push({t:'warn',m:`効果${i+1}: 毎ターンのリソース増加。放置で雪だるま式`});
    });
  });
  card.conditions.forEach((cd,i)=>{const c=C(cd.v);
    if(c.kind==='inst')f.push({t:'warn',m:`条件「${c.jp}」は瞬間型＝自傷等で自分で踏める。割引は小さめ＋プールでの踏みやすさを要レビュー`});
    if(c.kind==='enemy')f.push({t:'info',m:`条件「${c.jp}」は相手依存＝踏み倒せない＝割引大。逆転条件として健全`});
  });
  if(card.type!=='Spell'&&card.atk>=8)f.push({t:'warn',m:`高ATK。除去・必殺(デッドリー)で咎められるか要確認`});
  return f;
}

/* ===== JSON出力（v4/v5正本スキーマ。効果処理はエンジニア側） ===== */
function toJSON(){
  const o={cardId:card.id,name:card.name||'名称未設定',civilizations:card.civs.slice(),type:card.type,
    cost:{type:'EN',value:finalCost()},tags:card.tags.slice()};
  if(card.type!=='Spell')o.stats={attack:card.type==='Object'?0:card.atk,defense:card.hp};
  o.effectDescription=`【${card.name||'名称未設定'}】`+(card.type!=='Spell'?` ATK:${o.stats.attack} / HP:${card.hp}`:'')+` (Cost:${o.cost.value})`+(fullText()?'\n\n'+fullText():'');
  o.effects=card.effects.map(ef=>({trigger:ef.trigger,conditions:{},
    actions:ef.actions.map(a=>{const def=A(a.v),act={type:a.v};if(a.target)act.target=a.target;
      if(def.cnt)act.count=a.count||1;if(def.val)act.value=a.value||0;return act;})}));
  o.continuousEffects=card.keywords.map(k=>({conditions:{},modifiers:[K(k.v).x?{type:k.v,value:k.value||1}:{type:k.v}]}));
  o.conditions=card.conditions.map(cd=>{const c=C(cd.v),co={type:cd.v};if(c.x)co.value=cd.value||1;return co;});
  return o;
}

/* ===== 描画 ===== */
function render(){
  const cv=getComputedStyle(document.documentElement).getPropertyValue('--'+(card.civs[0]?card.civs[0].toLowerCase():'')).trim()||'#666';
  const c=$('#card');c.style.setProperty('--cv',cv);
  $('#c-nm').textContent=card.name||'無名のオリカ';
  $('#c-cost').textContent=finalCost();
  $('#c-meta').textContent=(card.civs.map(x=>CIVJP[x]).join('・')||'無')+' / '+(card.type==='Spell'?'スペル':card.type==='Object'?'オブジェクト':'モンスター')+(card.tags.length?' ['+card.tags.join(',')+']':'');
  $('#c-kws').innerHTML=card.keywords.map(k=>{const d=K(k.v);return `<span>${d.jp}${d.x?k.value:''}</span>`;}).join('');
  $('#c-txt').textContent=card.effects.length||card.keywords.length||card.conditions.length?fullText():'効果なし（バニラ）';
  $('#c-st').style.display=card.type==='Spell'?'none':'flex';
  $('#c-atk').textContent=card.type==='Object'?0:card.atk;$('#c-hp').textContent=card.hp;
  $('#e-cost').textContent=finalCost();$('#e-cp').textContent=score().toFixed(1);
  const fl=flags();$('#flags').innerHTML=fl.length?fl.map(x=>`<div class="flag ${x.t}">${x.m}</div>`).join(''):'<div class="flag ok">目立った危険フラグなし</div>';
  $('#jsonout').textContent=JSON.stringify(toJSON(),null,2);
  // 各効果のインラインプレビュー行を最新化
  $$('#efflist .eff').forEach((box,i)=>{const ef=card.effects[i];const pl=box.querySelector('.prev-line');
    if(ef&&pl)pl.textContent=ef.actions.map(a=>actText(ef,a)).join(' → ');});
}

/* ===== 入力配線 ===== */
$('#seg-type').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  $$('#seg-type button').forEach(x=>x.classList.toggle('on',x===b));card.type=b.dataset.t;
  $$('.mon').forEach(x=>x.style.display=card.type==='Spell'?'none':'');
  // オブジェクトはATKを持たない＝ATK欄を無効化し0固定
  const af=$('#f-atk');af.disabled=card.type==='Object';
  if(card.type==='Object'){card.atk=0;af.value=0;}else if(af.disabled===false&&+af.value===0&&card.atk===0){af.value=3;card.atk=3;}
  card.effects.forEach(ef=>{if(!validTrigs().find(t=>t.v===ef.trigger))ef.trigger=defaultTrig();ef.actions.forEach(a=>fixAct(ef,a));});
  if(card.type==='Spell')card.keywords=[];
  if(card.type==='Object')card.keywords=card.keywords.filter(k=>!K(k.v).atk); // 攻撃KWを除去
  buildKw();renderEff();render();});
$('#seg-civ').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  b.classList.toggle('on');card.civs=[...$$('#seg-civ button.on')].map(x=>x.dataset.c);render();});
$('#f-name').addEventListener('input',e=>{card.name=e.target.value;render();});
$('#f-atk').addEventListener('input',e=>{card.atk=+e.target.value||0;render();});
$('#f-hp').addEventListener('input',e=>{card.hp=+e.target.value||0;render();});
$('#f-tags').addEventListener('input',e=>{card.tags=e.target.value.split(',').map(s=>s.trim()).filter(Boolean);render();});
$('#btn-reset').addEventListener('click',()=>{card={id:uuid(),name:'',type:'Monster',atk:3,hp:5,civs:[],tags:[],keywords:[],effects:[],conditions:[]};
  $('#f-name').value='';$('#f-atk').value=3;$('#f-atk').disabled=false;$('#f-hp').value=5;$('#f-tags').value='';
  $$('#seg-type button').forEach(b=>b.classList.toggle('on',b.dataset.t==='Monster'));
  $$('#seg-civ button').forEach(b=>b.classList.remove('on'));$$('.mon').forEach(x=>x.style.display='');
  buildKw();renderEff();renderCond();render();});
$('#btn-dl').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(toJSON(),null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=card.id+'.json';a.click();URL.revokeObjectURL(u);});
$('#j-copy').addEventListener('click',()=>{navigator.clipboard?.writeText(JSON.stringify(toJSON(),null,2));
  $('#j-copy').textContent='コピー済み';setTimeout(()=>$('#j-copy').textContent='コピー',1200);});

/* init */
buildKw();renderEff();renderCond();render();
</script>
